<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Posts — HexSoftwares Blog</title>
  <meta name="description" content="Read all blog posts and create new ones. Posts are stored in your browser with localStorage.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">Hex<span class="dot">.</span>Blog</a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
      </button>
      <nav class="site-nav" aria-label="Primary">
        <button class="nav-close" aria-label="Close menu">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="blog.html" class="active">Blog Posts</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <h1 class="page-title">Blog Posts</h1>

    <!-- Add Post Form -->
    <div class="form-section">
      <h2>Create a New Post</h2>
      <form id="post-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="post-title">Title</label>
            <input type="text" id="post-title" name="title" required maxlength="80" placeholder="Give your post a title">
            <p class="field-error" id="title-error">Please enter a title.</p>
          </div>
          <div class="form-group">
            <label for="post-author">Author</label>
            <input type="text" id="post-author" name="author" required maxlength="50" placeholder="Your name">
            <p class="field-error" id="author-error">Please enter an author name.</p>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="post-date">Date</label>
            <input type="date" id="post-date" name="date" required>
            <p class="field-error" id="date-error">Please select a date.</p>
          </div>
        </div>
        <div class="form-group">
          <label for="post-content">Content</label>
          <textarea id="post-content" name="content" required placeholder="Write your blog post here..."></textarea>
          <p class="field-error" id="content-error">Please write some content.</p>
        </div>
        <button type="submit" class="btn btn-primary">Publish Post</button>
      </form>
    </div>

    <!-- Posts List -->
    <h2 class="section-heading">All Posts</h2>
    <div id="post-list" class="card-grid"></div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>&copy; 2026 Hex Softwares Web Development Internship &mdash; Task 1</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
